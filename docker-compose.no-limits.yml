# ============================================================
# NO LIMITS — container runs unrestricted
#
# WHY this is dangerous:
#   Without resource limits, a single container can consume
#   ALL available memory and CPU on the host, taking down
#   every other service running on the same machine.
#
# Try it:
#   docker compose -f docker-compose.no-limits.yml up -d
#   docker stats
#   POST http://localhost:8080/api/stress/memory?megabytes=200
#   POST http://localhost:8080/api/stress/cpu?seconds=30&threads=8
#   Watch 'docker stats' — no enforcement
# ============================================================

services:
  api-no-limits:
    build:
      context: .
      dockerfile: Dockerfile
    image: container-limits-demo:latest
    container_name: api-no-limits
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - MODE=NO_LIMITS
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

    # ⚠ NO resource limits defined here
    # The container can use ALL available host memory and CPU
    # This is what happens in production when developers forget limits
